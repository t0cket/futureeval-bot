name: Forecast on tournament questions

on:
  workflow_dispatch:
  schedule:
    # Questions stay open for 1.5 hours, so check every 20 minutes (offset off the hour).
    - cron: "7,27,47 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          INCLUDE_MINIBENCH: ${{ vars.INCLUDE_MINIBENCH || '1' }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION || '3' }}
      - name: Keep forecast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
