name: Forecast on tournament questions

on:
  workflow_dispatch:
  schedule:
    # GitHub drops many scheduled runs (we saw one in 7 hours on a 20-minute cron), so each
    # run polls for about 5 hours itself. The cron only has to fire once per run to keep
    # coverage continuous; extra triggers wait in the concurrency queue.
    - cron: "7,37 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot every 15 minutes for 5 hours
        # Questions stay open for 3 hours. A failed pass still fails the run, at the end.
        run: |
          failed=0
          end=$((SECONDS + 300 * 60))
          while [ $SECONDS -lt $end ]; do
            python bot.py --mode tournament || failed=1
            sleep 900
          done
          exit $failed
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          INCLUDE_MINIBENCH: ${{ vars.INCLUDE_MINIBENCH || '1' }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION || '3' }}
      - name: Keep forecast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
